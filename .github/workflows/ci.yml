name: CI - Integracion Continua Frontend

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: Compilacion Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar compilacion de Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"